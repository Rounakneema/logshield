---
# LOGSHIELD DASHBOARD
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logshield-dashboard
  namespace: logshield-protected
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logshield-dashboard
  template:
    metadata:
      labels:
        app: logshield-dashboard
    spec:
      containers:
      - name: dashboard
        image: logshield-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        # Dashboard reads API from ANY sidecar because they all share the logshield-data volume!
        - name: SIDECAR_API_URL
          value: "http://auth-service:8080/api"

---
apiVersion: v1
kind: Service
metadata:
  name: logshield-dashboard
  namespace: logshield-protected
spec:
  selector:
    app: logshield-dashboard
  ports:
  - name: dashboard-ui
    port: 3000
    targetPort: 3000

---
# TRAFFIC GENERATOR
# Hits the services in a loop to generate logs and leaks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: logshield-protected
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      containers:
      - name: generator
        image: alpine/curl
        command:
        - /bin/sh
        - -c
        - |
          while true; do
            # 1. AUTH SERVICE
            curl -s http://auth-service:8000/orders/$RANDOM > /dev/null
            curl -s http://auth-service:8000/auth?token=Bearer%20eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9 > /dev/null
            
            # 2. PAYMENT SERVICE
            curl -s http://payment-service:8000/orders/$RANDOM > /dev/null
            curl -s http://payment-service:8000/process-payment > /dev/null
            
            # 3. INVENTORY SERVICE
            curl -s http://inventory-service:8000/orders/$RANDOM > /dev/null
            curl -s http://inventory-service:8000/health > /dev/null
            
            # 4. USER SERVICE
            curl -s http://user-service:8000/orders/$RANDOM > /dev/null
            # Let's hit auth on user-service as well to simulate a leak there
            curl -s http://user-service:8000/auth?token=Bearer%20JWT123 > /dev/null
            
            # 5. NOTIFICATION SERVICE
            curl -s http://notification-service:8000/orders/$RANDOM > /dev/null
            curl -s http://notification-service:8000/debug > /dev/null
            
            sleep 1
          done
