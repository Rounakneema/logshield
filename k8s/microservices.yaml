# LogShield Microservices Deployment
# ==================================
# This YAML deploys a 5-service microservice environment:
#   1. auth-service
#   2. payment-service
#   3. inventory-service
#   4. user-service
#   5. notification-service
#
# It also deploys a traffic-generator pod to continuously hit these endpoints.
# All services share a hostPath volume to aggregate data into a single LogShield Dashboard.

apiVersion: v1
kind: Namespace
metadata:
  name: logshield-protected
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logshield-sa
  namespace: logshield-protected
---
# Shared PVC for Data Aggregation (Simulated via hostPath for simplicity on Minikube)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: logshield-pv
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: "/tmp/logshield-data"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logshield-data-pvc
  namespace: logshield-protected
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi

---
# Macro template for a microservice
# To keep this file concise, we deploy the same target-app but set different ENV vars for each.
# In a real environment, these would be separate container images.

# 1. AUTH SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: logshield-protected
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: logshield-sa
      containers:
      - name: target-app
        image: logshield-protected-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgres://admin:MyP@ssw0rd123@auth-db:5432/prod"
        volumeMounts:
        - name: shared-logs
          mountPath: /shared
      - name: logshield-sidecar
        image: logshield-sidecar:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: STATS_OUTPUT_PATH
          value: "/data/stats_auth.json"
        - name: RECENT_LOGS_PATH
          value: "/data/recent_logs_auth.json"
        volumeMounts:
        - name: shared-logs
          mountPath: /shared
          readOnly: true
        - name: logshield-data
          mountPath: /data
      volumes:
      - name: shared-logs
        emptyDir: {}
      - name: logshield-data
        persistentVolumeClaim:
          claimName: logshield-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: logshield-protected
spec:
  selector:
    app: auth-service
  ports:
  - name: target-app
    port: 8000
    targetPort: 8000
  - name: sidecar-api
    port: 8080
    targetPort: 8080

---
