    spec:
      containers:
      - name: target-app
        image: logshield-protected-app:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: STRIPE_SECRET_KEY
          value: "sk_live_paymentabc123456789"
        volumeMounts:
        - name: shared-logs
          mountPath: /shared
      - name: logshield-sidecar
        image: logshield-sidecar:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: STATS_OUTPUT_PATH
          value: "/data/stats_payment.json"
        - name: RECENT_LOGS_PATH
          value: "/data/recent_logs_payment.json"
        volumeMounts:
        - name: shared-logs
          mountPath: /shared
        - name: logshield-data
          mountPath: /data
      volumes:
      - name: shared-logs
        emptyDir: {}
      - name: logshield-data
        persistentVolumeClaim:
          claimName: logshield-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: logshield-protected
spec:
  selector:
    app: payment-service
  ports:
  - name: target-app
    port: 8000
