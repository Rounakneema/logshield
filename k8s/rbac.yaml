# RBAC for LogShield
# ====================

apiVersion: v1
kind: Namespace
metadata:
  name: logshield-protected
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logshield-sa
  namespace: logshield-protected
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: logshield-secret-reader
  namespace: logshield-protected
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["list", "get"]   # READ-ONLY — never write, update, or delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: logshield-secret-reader-binding
  namespace: logshield-protected
subjects:
- kind: ServiceAccount
  name: logshield-sa
  namespace: logshield-protected
roleRef:
  kind: Role
  name: logshield-secret-reader
  apiGroup: rbac.authorization.k8s.io
